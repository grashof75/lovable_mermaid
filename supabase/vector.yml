---
# Vector configuration for Supabase logging
# https://vector.dev/docs/reference/configuration/

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  docker_host:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock

  kong_logs:
    type: file
    include:
      - /var/log/kong/*.log

transforms:
  kong_logs_json:
    type: remap
    inputs:
      - kong_logs
    source: |
      parsed, err = parse_json(.message)
      if err == null {
        . = merge(., parsed)
      }

  docker_logs_json:
    type: remap
    inputs:
      - docker_host
    source: |
      parsed, err = parse_json(.message)
      if err == null {
        .message = parsed
      }

sinks:
  logflare_logs:
    type: http
    inputs:
      - kong_logs_json
      - docker_logs_json
    uri: http://analytics:4000/api/logs
    encoding:
      codec: json
    auth:
      strategy: bearer
      token: "${LOGFLARE_API_KEY}"
    request:
      headers:
        X-API-KEY: "${LOGFLARE_API_KEY}"
        Content-Type: "application/json"
    batch:
      max_bytes: 1048576
      timeout_secs: 1

  console:
    type: console
    inputs:
      - kong_logs_json
      - docker_logs_json
    encoding:
      codec: json
